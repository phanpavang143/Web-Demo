# Server configuration
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp

# AWS integrations are opt-in. Use an IAM role or the AWS default credential chain.
aws.enabled=${AWS_ENABLED:false}

# Hibernate
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.show_sql=false
hibernate.hbm2ddl.auto=update

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/ecommjava?createDatabaseIfNotExist=true
db.username=root
db.password=
entitymanager.packagesToScan=com.jtspringproject.JtSpringProject.models