<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Harvest & Home login page for the demo storefront."
    />
    <title>Sign in | Harvest &amp; Home</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="login-page">
    <div class="page-shell">
      <header class="login-hero">
        <div class="logo-wrap" aria-label="Harvest and Home brand">
          <span class="logo-mark">+</span>
          <span class="logo-text">Harvest &amp; Home</span>
        </div>

        <h1>Come on in.</h1>
        <p class="intro-copy">Keep your everyday essentials close and your shopping simple.</p>
      </header>

      <main class="login-panel" aria-label="Sign in form">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue to your account.</p>

        <form class="login-form" id="login-form">
          <div class="field-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>

          <button type="submit">Sign in</button>
          <p class="form-status" id="form-status" role="status" hidden>
            This GitHub Pages preview is static. Run the Spring Boot application for account authentication.
          </p>
        </form>
      </main>
    </div>
    <script>
      document.getElementById('login-form').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('form-status').hidden = false;
      });
    </script>
  </body>
</html>
